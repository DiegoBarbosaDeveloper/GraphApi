extend schema
  @link(url: "https://specs.apollo.dev/federation/v2.0", import: ["@key", "@shareable"])

enum EstadoOrden {
  PENDIENTE
  PAGADA
  COMPLETADA
  CANCELADA
}

type Orden @key(fields: "id") {
  id: ID!
  estado: EstadoOrden!
  usuarioId: ID!
  total: Float!
  creadoEn: String!
  actualizadoEn: String!
}

type Query {
  ordenes: [Orden!]!
  orden(id: ID!): Orden
}

type Mutation {
  crearOrden(usuarioId: ID!): Orden!
  actualizarOrden(id: ID!, estado: String): Orden!
  eliminarOrden(id: ID!): Boolean!
}
