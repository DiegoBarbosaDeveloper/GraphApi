"""
Campos que se pueden modificar en una orden.
"""
input ActualizarOrdenInput {
  estado: EstadoOrden
}

"""
Campos que se pueden modificar en un pago.
"""
input ActualizarPagoInput {
  estado: EstadoPago
  metodo: MetodoPago
  monto: Float
  ordenId: ID
  referencia: String
}

"""
Campos que se pueden modificar en un pedido.
"""
input ActualizarPedidoInput {
  cantidad: Int
  descripcion: String
  ordenId: ID
  precioUnitario: Float
  producto: String
  usuarioId: ID
}

"""
Campos que se pueden modificar en un usuario.
"""
input ActualizarUsuarioInput {
  activo: Boolean
  email: String
  nombre: String
  telefono: String
}

"""
Datos necesarios para crear una orden.
"""
input CrearOrdenInput {
  estado: EstadoOrden
  usuarioId: ID!
}

"""
Datos necesarios para crear un pago.
"""
input CrearPagoInput {
  estado: EstadoPago
  metodo: MetodoPago!
  monto: Float!
  ordenId: ID!
  referencia: String
}

"""
Datos necesarios para crear un pedido.
"""
input CrearPedidoInput {
  cantidad: Int!
  descripcion: String
  ordenId: ID!
  precioUnitario: Float!
  producto: String!
  usuarioId: ID!
}

"""
Datos necesarios para crear un usuario.
"""
input CrearUsuarioInput {
  email: String!
  nombre: String!
  telefono: String
}

"""
A date-time string at UTC, such as 2019-12-03T09:54:33Z, compliant with the date-time format.
"""
scalar DateTime

"""
Estado actual del ciclo de vida de una orden.
"""
enum EstadoOrden {
  CANCELADA
  COMPLETADA
  PAGADA
  PENDIENTE
}

"""
Estado actual de un pago.
"""
enum EstadoPago {
  APROBADO
  PENDIENTE
  RECHAZADO
  REEMBOLSADO
}

"""
Medio utilizado para realizar un pago.
"""
enum MetodoPago {
  EFECTIVO
  OTRO
  TARJETA
  TRANSFERENCIA
}

type Mutation {
  """
  Actualiza el estado de una orden.
  """
  actualizarOrden(id: ID!, input: ActualizarOrdenInput!): Orden!

  """
  Actualiza un pago.
  """
  actualizarPago(id: ID!, input: ActualizarPagoInput!): Pago!

  """
  Actualiza un pedido.
  """
  actualizarPedido(id: ID!, input: ActualizarPedidoInput!): Pedido!

  """
  Actualiza un usuario.
  """
  actualizarUsuario(id: ID!, input: ActualizarUsuarioInput!): Usuario!

  """
  Crea una orden.
  """
  crearOrden(input: CrearOrdenInput!): Orden!

  """
  Crea un pago para una orden.
  """
  crearPago(input: CrearPagoInput!): Pago!

  """
  Crea un pedido en una orden.
  """
  crearPedido(input: CrearPedidoInput!): Pedido!

  """
  Crea un usuario.
  """
  crearUsuario(input: CrearUsuarioInput!): Usuario!

  """
  Elimina una orden que no tenga pedidos ni pagos.
  """
  eliminarOrden(id: ID!): Boolean!

  """
  Elimina un pago.
  """
  eliminarPago(id: ID!): Boolean!

  """
  Elimina un pedido.
  """
  eliminarPedido(id: ID!): Boolean!

  """
  Elimina un usuario sin pedidos ni órdenes.
  """
  eliminarUsuario(id: ID!): Boolean!
}

"""
Orden que agrupa pedidos y sus pagos.
"""
type Orden {
  actualizadoEn: DateTime!
  creadoEn: DateTime!
  estado: EstadoOrden!
  id: ID!

  """
  Pagos asociados a la orden.
  """
  pagos: [Pago!]!

  """
  Pedidos incluidos en la orden.
  """
  pedidos: [Pedido!]!

  """
  Suma de los subtotales de sus pedidos.
  """
  total: Float!

  """
  Usuario propietario de la orden.
  """
  usuario: Usuario!
  usuarioId: ID!
}

"""
Pago asociado a una orden.
"""
type Pago {
  actualizadoEn: DateTime!
  creadoEn: DateTime!
  estado: EstadoPago!
  id: ID!
  metodo: MetodoPago!
  monto: Float!
  orden: Orden!
  ordenId: ID!
  referencia: String
}

"""
Línea de producto incluida en una orden y creada por un usuario.
"""
type Pedido {
  actualizadoEn: DateTime!
  cantidad: Int!
  creadoEn: DateTime!
  descripcion: String
  id: ID!
  orden: Orden!
  ordenId: ID!
  precioUnitario: Float!
  producto: String!

  """
  Cantidad multiplicada por el precio unitario.
  """
  subtotal: Float!
  usuario: Usuario!
  usuarioId: ID!
}

type Query {
  """
  Obtiene una orden por su id.
  """
  orden(id: ID!): Orden!

  """
  Lista todas las ordenes.
  """
  ordenes: [Orden!]!

  """
  Obtiene un pago por su id.
  """
  pago(id: ID!): Pago!

  """
  Lista pagos; opcionalmente se filtran por orden.
  """
  pagos(ordenId: ID): [Pago!]!

  """
  Obtiene un pedido por su id.
  """
  pedido(id: ID!): Pedido!

  """
  Lista pedidos; opcionalmente se filtran por usuario y/o orden.
  """
  pedidos(ordenId: ID, usuarioId: ID): [Pedido!]!

  """
  Obtiene un usuario por su id.
  """
  usuario(id: ID!): Usuario!

  """
  Lista todos los usuarios.
  """
  usuarios: [Usuario!]!
}

"""
Usuario propietario de órdenes y creador de pedidos.
"""
type Usuario {
  activo: Boolean!
  actualizadoEn: DateTime!
  creadoEn: DateTime!
  email: String!
  id: ID!
  nombre: String!

  """
  Órdenes propiedad del usuario.
  """
  ordenes: [Orden!]!

  """
  Pedidos creados por el usuario.
  """
  pedidos: [Pedido!]!
  telefono: String
}
