type Usuario @key(fields: "id") {
  id: ID!
  nombre: String!
  email: String!
  telefono: String
  activo: Boolean!
  pedidos: [Pedido] @external
  ordenes: [Orden] @external
  creadoEn: DateTime!
  actualizadoEn: DateTime!
}

input CrearUsuarioInput {
  nombre: String!
  email: String!
  telefono: String
}

input ActualizarUsuarioInput {
  nombre: String
  email: String
  telefono: String
  activo: Boolean
}

extend type Query {
  usuarios: [Usuario!]!
  usuario(id: ID!): Usuario
}

extend type Mutation {
  crearUsuario(input: CrearUsuarioInput!): Usuario!
  actualizarUsuario(id: ID!, input: ActualizarUsuarioInput!): Usuario!
  eliminarUsuario(id: ID!): Boolean!
}
