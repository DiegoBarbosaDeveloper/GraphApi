enum MetodoPago {
  TARJETA
  EFECTIVO
  TRANSFERENCIA
  OTRO
}

enum EstadoPago {
  PENDIENTE
  APROBADO
  RECHAZADO
  REEMBOLSADO
}

type Pago @key(fields: "id") {
  id: ID!
  monto: Float!
  metodo: MetodoPago!
  estado: EstadoPago!
  referencia: String
  ordenId: ID!
  orden: Orden @external
  creadoEn: DateTime!
  actualizadoEn: DateTime!
}

input CrearPagoInput {
  monto: Float!
  metodo: MetodoPago!
  referencia: String
  ordenId: ID!
}

input ActualizarPagoInput {
  monto: Float
  metodo: MetodoPago
  estado: EstadoPago
  referencia: String
}

extend type Query {
  pagos(ordenId: ID): [Pago!]!
  pago(id: ID!): Pago
}

extend type Mutation {
  crearPago(input: CrearPagoInput!): Pago!
  actualizarPago(id: ID!, input: ActualizarPagoInput!): Pago!
  eliminarPago(id: ID!): Boolean!
}
